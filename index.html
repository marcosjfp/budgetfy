<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="light dark" />
    <title>BudgetFy - Shared Expense Tracker</title>
    <script>
      // Set <html lang> before React loads (mirrors src/i18n/core.ts detectLanguage).
      (function () {
        try {
          var saved = localStorage.getItem('budgetfy_lang');
          var nav = navigator.language || '';
          var pt = saved ? saved === 'pt' : nav.toLowerCase().indexOf('pt') === 0;
          document.documentElement.lang = pt ? 'pt-BR' : 'en';
          if (pt) document.title = 'BudgetFy - Controle de despesas compartilhadas';
          // Apply the theme before first paint (mirrors src/hooks/useTheme.ts) to avoid a flash.
          var theme = localStorage.getItem('theme');
          if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
